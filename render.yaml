# =============================================================================
# SGHL — Blueprint Render
# Déploiement : Dashboard Render → New → Blueprint → connecter ce dépôt Git
# =============================================================================
#
# Syntaxe officielle Render Blueprint (2024+):
#   Backend  → type: web, runtime: python, plan: free, region: frankfurt
#   Frontend → type: web, runtime: static (sans plan ni region — les sites
#              statiques sont toujours gratuits sur Render)
#   Base de données PostgreSQL → type: Pserv, plan: free
# =============================================================================

databases:
  - name: sghl-db
    plan: free
    databaseName: sghl
    user: sghl
    region: frankfurt

services:
  # ---------------------------------------------------------------------------
  # Backend Django (API Ninja) — Python Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: sghl-backend
    runtime: python
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py seed_sghl_demo
    startCommand: gunicorn sghl_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: sghl-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SHOW_MFA_CODE_IN_CONSOLE
        value: "False"
      - key: USE_WHITENOISE
        value: "True"
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: sghl-backend
          property: host
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: sghl-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: DEFAULT_FROM_EMAIL
        value: sghl-notification@hopital.com
      - key: SKIP_APPOINTMENT_CAPACITY_CHECK
        value: "1"

  # ---------------------------------------------------------------------------
  # Frontend Vue 3 (Static Site) — type: web + runtime: static
  # ---------------------------------------------------------------------------
  # Note : les sites statiques Render utilisent "runtime: static" et
  # n'acceptent PAS les champs "plan" ni "region".
  # ---------------------------------------------------------------------------
  - type: web
    name: sghl-frontend
    runtime: static
    rootDir: sghl_frontend
    buildCommand: bash ./build-render.sh
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: sghl-backend
          envVarKey: RENDER_EXTERNAL_URL

